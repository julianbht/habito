[project]
name = "habito"
version = "0.1.0"
description = "Minimalist Pomodoro habit tracker with tamper-evident, git-anchored logging"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian" }]
dependencies = [
    "pydantic>=2.6",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
    # Windows ships no IANA timezone database, so zoneinfo has nothing to read without
    # this. Installed everywhere so the timezone setting behaves identically per platform.
    "tzdata>=2024.1",
]

[project.scripts]
habito = "habito.app:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habito"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Committed so the checker's strictness is a property of the project rather than of
# whichever editor opens it.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# Only the library is held to strict. Strict demands a known type for every name, and a
# pytest fixture arrives as a bare parameter (`def test_x(qtbot, tmp_path)`) — which alone
# accounts for ~1700 findings that say nothing about whether the code works.
strict = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
