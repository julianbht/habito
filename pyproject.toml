[project]
name = "habito"
version = "0.1.0"
description = "Minimalist Pomodoro habit tracker with tamper-evident, git-anchored logging"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian" }]
dependencies = [
    "pydantic>=2.6",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
    "tomlkit>=0.12",
]

[project.scripts]
habito = "habito.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habito"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
