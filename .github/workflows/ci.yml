name: CI

# Automatic triggers are off for now; run it by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  check:
    # Windows because that's what the app ships on, and because the Qt tests and the
    # git-backed evidence test are the parts most likely to differ per platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date rather than silently resolving anew.
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run pyright

      # conftest.py forces QT_QPA_PLATFORM=offscreen, so no display is needed.
      - name: Tests
        run: uv run pytest
